# Target definition for remote build/deploy (copy this folder to apt-config.private
# and edit the copy; never put real values in the template).
# Syntax is plain Makefile assignments (no quotes, no spaces around =).

# Address (or ~/.ssh/config alias) of the Beckhoff IPC that builds and runs the containers
TARGET_HOST=ip-address-of-target
# SSH user on the target; must be allowed to run `docker` without sudo (member of group "docker")
TARGET_USER=<target-user>
TARGET_PORT=22
# Optional: private SSH key used to log in (leave empty to use ssh-agent / ~/.ssh/config)
TARGET_SSH_KEY=
# Folder on the target where deploy-containers copies each sample's compose files
TARGET_DIR=tc-xar-samples
