per_listener_settings true

# Plain MQTT, anonymous. Only reachable from the libvirt bridge br200 (host firewall) and from container-network.
listener 1883
allow_anonymous true

# MQTT over TLS with user name and password, no anonymous access. Reachable via eno1 and br200 (host firewall).
# Not used for ADS-over-MQTT (that uses port 1883), only for other communication.
# The files in /mosquitto/secure come from mosquitto-broker/secure (see README, not part of the repository).
#listener 8883
#allow_anonymous false
#password_file /mosquitto/secure/passwd
#cafile /mosquitto/secure/ca.crt
#certfile /mosquitto/secure/server.crt
#keyfile /mosquitto/secure/server.key

persistence true
persistence_location /mosquitto/data
